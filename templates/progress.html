<!-- Progress Form -->
<form action="/add_progress" method="post" class="progress-form">
    <h2>Record Recovery Progress</h2>

    <div class="form-group">
        <label for="injury_type">Select Injury:</label>
        <select name="injury_type" id="injury_type" class="form-control" required>
            {% for injury in injuries %}
            <option value="{{ injury }}">{{ injury }}</option>
            {% endfor %}
        </select>
    </div>
    

    <div class="form-group">
        <label for="date">Date:</label>
        <input type="date" name="date" id="date" class="form-control" required>
    </div>

    <div class="form-group">
        <label for="pain_level">Pain Level:</label>
        <input type="number" name="pain_level" id="pain_level" class="form-control" min="0" max="10" required>
    </div>

    <div class="form-group">
        <label for="exercise_completed">Exercises Completed:</label><br>
        <input type="radio" name="exercise_completed" value="1" id="exercise_completed_yes" required> <label for="exercise_completed_yes">Yes</label>
        <input type="radio" name="exercise_completed" value="0" id="exercise_completed_no"> <label for="exercise_completed_no">No</label>
    </div>

    <div class="form-group">
        <button type="submit" class="submit-btn">Add Progress</button>
    </div>

    <br>
    <a href="/chart" class="link-btn">View Recovery Progress</a>

    <script src="/static/js/script.js"></script>
    
</form>
