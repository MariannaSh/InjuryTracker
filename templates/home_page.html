<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injury Information</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home_page.css') }}">
</head>
<body>

    <!-- Navigation Menu -->
    <nav class="menu">
        <ul>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/test">BMI</a></li>
            <li><a href="/home">Home</a></li>
            <li><a href="/progress">Progress</a></li>
        </ul>
    </nav>

    <!-- Form Container -->
    <main class="form-container">
        <h1>Enter Injury Details</h1>

        <!-- Injury Information Form -->
        <form action="/submit" method="POST" onsubmit="validateForm(event)">
            <div class="form-group">
                <label for="injury_type">Select Injury:</label>
                <select name="injury_type" id="injury_type" required>
                    {% for injury in injuries %}
                    <option value="{{ injury }}">{{ injury }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" name="age" id="age" min="0" max="1000">
            </div>

            <div class="form-group">
                <label for="fitness_level">Fitness Level:</label>
                <select name="fitness_level" id="fitness_level" required>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            
            <div class="form-group checkbox-group">
                    <input type="checkbox" id="diagnosis_confirmed" name="diagnosis_confirmed">
                    <label for="diagnosis_confirmed">Diagnosis confirmed by doctor</label>
            </div>
        
            <button type="submit" class="submit-btn">Get Recommendations</button>
        </form>

        <div class="links">
            <!-- Update the link to point to the calendar section -->
            <a href="#calendar-container" class="link-btn">Go to Calendar</a>
            <a href="{{ url_for('logout') }}" class="link-btn">Logout</a>
        </div>
    </main>

    <!-- Calendar Container -->
    <div class="container">
        <!-- Календарь -->
        <div id="calendar-container">
            <div id="calendar"></div>
        </div>
        
        <!-- Блок заметок с видео -->
        <div id="video-notes">
            <h2>Favorite Workouts</h2>
            <div class="add-video">
                <input type="text" id="video_title" placeholder="Workout Name">
                <input type="text" id="video_url" placeholder="Paste YouTube link">
                <select id="video_category">
                    <option value="Back">Back</option>
                    <option value="Abs">Abs</option>
                    <option value="Legs">Legs</option>
                    <option value="Arms">Arms</option>
                    <option value="Stretching">Stretching</option>
                </select>
                <button onclick="addVideo()">Add</button>
            </div>
        
            <div class="video-filter">
                <label for="filter_category">Filter by category:</label>
                <select id="filter_category" onchange="filterVideos()">
                    <option value="all">All</option>
                    <option value="Back">Back</option>
                    <option value="Abs">Abs</option>
                    <option value="Legs">Legs</option>
                    <option value="Arms">Arms</option>
                    <option value="Stretching">Stretching</option>
                </select>
            </div>
        
            <div id="videos_list"></div>
        </div>
    </div>
    <br><br>

    <script src="/static/js/script.js"></script>

    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js'></script>
</body>
</html>
