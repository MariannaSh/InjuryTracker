<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>

    <h1>Введите информацию о травме:</h1>

    
    <form action="/submit" method="POST" onsubmit="validateForm(event)">
        <label for="injury_type">Выберите травму:</label>
        <select name="injury_type" id="injury_type">
            {% for injury in injuries %}
            <option value="{{ injury }}">{{ injury }}</option>
            {% endfor %}
        </select>

        <label for="age">Возраст:</label>
        <input type="number" name="age" id="age" min="1" max="100" required><br><br>
    
        <label for="fitness_level">Уровень физической подготовки:</label>
        <select name="fitness_level" id="fitness_level" required>
            <option value="low">Низкий</option>
            <option value="medium">Средний</option>
            <option value="high">Высокий</option>
        </select><br><br>

        <label for="diagnosis_confirmed">
            <input type="checkbox" name="diagnosis_confirmed" id="diagnosis_confirmed">
            Диагноз подтвержден у врача
        </label><br><br>
    
        <button type="submit">Получить рекомендации</button>
    </form>
    
    <script src="/static/js/script.js"></script>

    <br>
    <a href="/progress">Записать прогресс восстановления</a>
    <br>
    <a href="{{ url_for('logout') }}">Logout</a>

</body>
</html>
