<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injury Information</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home_page.css') }}">
</head>
<body>

    <!-- Navigation Menu -->
    <nav class="menu">
        <ul>
            <li><a href="base.html">Profile</a></li>
            <li><a href="/home">Home</a></li>
            <li><a href="/progress">Progress</a></li>
        </ul>
    </nav>

    <main class="form-container">
        <h1>Enter Injury Details</h1>

        <!-- Injury Information Form -->
        <form action="/submit" method="POST" onsubmit="validateForm(event)">
            <div class="form-group">
                <label for="injury_type">Select Injury:</label>
                <select name="injury_type" id="injury_type" required>
                    {% for injury in injuries %}
                    <option value="{{ injury }}">{{ injury }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" name="age" id="age" min="1" max="100" required>
            </div>

            <div class="form-group">
                <label for="fitness_level">Fitness Level:</label>
                <select name="fitness_level" id="fitness_level" required>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" name="diagnosis_confirmed" id="diagnosis_confirmed">
                <label for="diagnosis_confirmed">Diagnosis confirmed by doctor</label>
            </div>

            <button type="submit" class="submit-btn">Get Recommendations</button>
        </form>

        <div class="links">
            <a href="/progress" class="link-btn">Record Recovery Progress</a>
            <a href="{{ url_for('logout') }}" class="link-btn">Logout</a>
        </div>
        
    </main>

    <script src="/static/js/script.js"></script>
</body>
</html>
