<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <h1>Welcome, {{ username }}!</h1>
        </div>

        <div class="profile-container">
            <h2>Your Profile</h2>

            {% if profile_image %}
                <div class="profile-picture">
                    <img src="{{ url_for('static', filename='uploads/' + profile_image) }}" alt="Profile Picture" class="profile-img">
                </div>
            {% else %}
                <p>No profile picture uploaded.</p>
            {% endif %}

            <div class="image-upload">
                <h3>Upload Profile Picture:</h3>
                <form action="{{ url_for('upload_profile_image') }}" method="POST" enctype="multipart/form-data">
                    <label for="profile_image">Choose an image:</label>
                    <input type="file" name="profile_image" id="profile_image" accept="image/*" required><br>
                    <button type="submit">Upload Image</button>
                </form>
            </div>
            <br>
            <div class="form-container">
                <form method="POST" action="{{ url_for('change_username') }}">
                    <label for="new_username">New username:</label>
                    <input type="text" id="new_username" name="new_username" required>
                    <button type="submit">Change username</button>
                </form>
                <br>
                <form method="POST" action="{{ url_for('auth.change_password') }}">
                    <label for="current_password">Current password:</label>
                    <input type="password" id="current_password" name="current_password" required><br>
                    <label for="new_password">New Password:</label>
                    <input type="password" id="new_password" name="new_password" required><br>
                    <button type="submit">Change password</button>
                </form>
            </div>

            <div class="profile-actions">
                <a href="{{ url_for('home_page') }}" class="action-link">Go to Home</a><br>
                <a href="{{ url_for('logout') }}" class="action-link">Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
