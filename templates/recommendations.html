<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рекомендации</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #0056b3;
        }
        .recommendation {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
        }
        .recommendation img, .recommendation video {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
            border-radius: 5px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        video {
            max-width: 300px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Рекомендации</h1>

    {% if recommendations %}
        {% for rec in recommendations %}
        <div class="recommendation">
            <p>{{ rec.text }}</p>  <!-- Текст рекомендации -->
            {% if rec.image_url %}
                <img src="{{ rec.image_url }}" alt="Recommendation Image">  <!-- Изображение -->
            {% endif %}
            {% if rec.video_url %}
                <video controls>
                    <source src="{{ rec.video_url }}" type="video/mp4">
                    Ваш браузер не поддерживает воспроизведение видео.
                </video>  <!-- Видео -->
            {% endif %}
        </div>
        {% endfor %}
    {% else %}
        <p>Рекомендации отсутствуют.</p>
    {% endif %}
</body>
</html>
