<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рекомендации</title>
</head>
<body>
    <h1>Рекомендации</h1>
    <ul>
        {% for recommendation in recommendations %}
            <li>{{ recommendation }}</li>
        {% endfor %}
    </ul>
    <p>
        {% if request.form.get('diagnosis_confirmed') %}
            Диагноз подтверждён у врача.
        {% else %}
            Диагноз не подтверждён.
        {% endif %}
    </p>
    <a href="/">Назад</a>
</body>
</html>
