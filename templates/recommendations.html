<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рекомендации</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/recommendation.css') }}">
</head>
<body>
    <h1>Рекомендации</h1>

    {% if recommendations %}
        {% for rec in recommendations %}
        <div class="recommendation">
            <div class="recommendation-content">
                <p>{{ rec.text | replace('\n', '<br>') | safe }}</p>
            </div>

            <div class="media-container">
                {% if rec.image_url %}
                    <img src="{{ rec.image_url }}" alt="Recommendation Image">
                {% endif %}

                {% if rec.video_url %}
                <div class="video-wrapper">
                    <a href="{{ rec.video_url }}" target="_blank">
                        <div class="video-overlay">
                            <video class="video-recommendation" controls>
                                <source src="{{ rec.video_url }}" type="video/mp4">
                            </video>
                        </div>
                        Смотреть видео
                    </a>
                </div>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    {% else %}
        <p>Рекомендации отсутствуют.</p>
    {% endif %}

    <div class="home-button-container" style="text-align: center; margin-top: 30px;">
        <a href="/home" class="home-button" style="display: inline-block; padding: 10px 20px; background-color: #03dac6; color: #fff; text-decoration: none; border-radius: 5px;">Home</a>
    </div>

</body>
</html>
